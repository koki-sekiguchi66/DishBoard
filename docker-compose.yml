# 開発用 Docker Compose。
# 本番構成は docker-compose.production.yml（別物として管理する）。
# Celery / Redis は廃止済み（学食スクレイピングは GitHub Actions cron → manage.py update_cafeteria_menus）。

services:
  db:
    image: postgres:16-alpine
    container_name: dishboard_db
    # 開発時の環境変数は backend/.env に一本化する（compose 用の別ファイルを持たない）
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ はコンテナ内で展開させるためのエスケープ（compose 側で解決させない）
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dishboard_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: dishboard_backend
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py load_standard_foods /app/data/standard_foods.csv &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dishboard_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: dishboard_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      # node_modules はイメージ内のものを使う（ホスト側で上書きさせない）。
      # package.json を変えたら docker compose rm -v -f frontend で volume ごと消すこと。
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - dishboard_network

volumes:
  postgres_data:

networks:
  dishboard_network:
    driver: bridge
